<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="a.out.js"></script>
    <title>My Simple MDN Page</title>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <p>This is a basic HTML document structured using clean, semantic code.</p>
    <input type="text" id="output" style="width: 300px; height: 50px;"/>
    <button id="test-button" disabled>Run test</button>
    <script>
        const btn = document.getElementById('test-button');
        const output = document.getElementById('output');
        
        Module.onRuntimeInitialized = () => {
            btn.disabled = false;
            btn.addEventListener('click', () => {
                const result = Module.runInterperter();
                output.value = result;
            });
        }
    </script>
  </body>
</html>
