<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="a.out.js"></script>
    <title>My Simple MDN Page</title>
  </head>
  <body>
    <form>
        <label>enter brainfsck program:
        <input type="text" id="input" style="width: 300px; height: 50px;"/>
    </form>
    <label> output:
    <input type="text" id="output" style="width: 300px; height: 50px;"/>
    <input type="button" value="run" id="run">
    <br>
    <pre>
    supported instructions
    > - increase data pointer (move to the right)
    < - decrease data pointer (move to the left)
    + - increase current cell at data pointer by one
    - - decrease current cell at data pointer by one
    . - output data pointer
    , - accept one byte of data at current cell of data pointer (can only be a single character)
    [ - if current cell is 0 jump to matching ]
    ] - if current cell is not 0 jump to matching [
    </pre>
    <script>
        const btn = document.getElementById('run');
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        
        Module.onRuntimeInitialized = () => {
            btn.disabled = false;
            btn.addEventListener('click', () => {
                const data = input.value;
                const result = Module.runInterperter(data);
                output.value = result;
            });
        }
    </script>
  </body>
</html>
