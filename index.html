<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="a.out.js"></script>
    <title>My Simple MDN Page</title>
  </head>
  <body>
    <form>
        <label>enter brainfsck program:
        <input type="text" id="input" style="width: 300px; height: 50px;"/>
    </form>
    <label> output:
    <input type="text" id="output" style="width: 300px; height: 50px;"/>
    <input type="button" value="run" id="run">
    <script>
        const btn = document.getElementById('run');
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        
        Module.onRuntimeInitialized = () => {
            btn.disabled = false;
            btn.addEventListener('click', () => {
                const data = input.value;
                const result = Module.runInterperter(data);
                output.value = result;
            });
        }
    </script>
  </body>
</html>
